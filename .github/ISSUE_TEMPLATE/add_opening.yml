      label: "[Peli 1] ID de TMDB"
      placeholder: "Ej: 550"
  - type: input
    id: peli_deezer_1
    attributes:
      label: "[Peli 1] ID de Deezer o URL de Audio Directa"
      placeholder: "Ej: 12345678 o https://.../audio.mp3"

