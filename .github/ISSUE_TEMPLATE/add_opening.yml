name: "Añadir Openings en Lote (Películas y Series)"
description: "Añade hasta 5 películas y hasta 5 series de golpe desde el móvil (Soporta IDs de Deezer o URLs de audio directas)"
title: "[Lote]: "
labels: ["manual-addition"]
body:
