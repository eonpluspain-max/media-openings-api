name: Manual Add Opening

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  add-entry:
    if: contains(github.event.issue.labels.*.name, 'manual-addition')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar script de procesamiento
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python process_issue.py

      - name: Subir cambios al JSON
        run: |
          git config user.name 'Bot Openings'
          git config user.email 'bot@github.com'
          git add media_openings.json
          git commit -m "Manual: Añadido desde Issue #${{ github.event.issue.number }}" || exit 0
          git push

      - name: Cerrar Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ **¡Procesado con éxito!** El ID se ha añadido a `media_openings.json`.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
